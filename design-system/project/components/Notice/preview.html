<!-- @dsCard group="Feedback" height=280 subtitle="Info, success and danger; every status carries an icon and a word, never color alone" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Notice</title>
<style>.pv { display: grid; gap: var(--space-4); padding: var(--space-6); grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); align-items: start; }</style>
</head>
<body>
<div class="pv">
  <div class="ii-notice ii-notice--info"><svg class="ii-icon" data-ii-icon="info-circle" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M3 12a9 9 0 1 0 18 0a9 9 0 0 0 -18 0" /> <path d="M12 9h.01" /> <path d="M11 12h1v4h1" /></svg><div class="ii-notice__body"><p class="ii-notice__title">Emergency repair</p><p>For outages and emergency repair, call (503) 502-5339.</p></div></div>
  <div class="ii-notice ii-notice--success"><svg class="ii-icon" data-ii-icon="circle-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M3 12a9 9 0 1 0 18 0a9 9 0 1 0 -18 0" /> <path d="M9 12l2 2l4 -4" /></svg><div class="ii-notice__body"><p class="ii-notice__title">Request sent</p><p>We will follow up by phone or email.</p></div></div>
  <div class="ii-notice ii-notice--danger"><svg class="ii-icon" data-ii-icon="alert-triangle" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M12 9v4" /> <path d="M10.363 3.591l-8.106 13.534a1.914 1.914 0 0 0 1.636 2.871h16.214a1.914 1.914 0 0 0 1.636 -2.87l-8.106 -13.536a1.914 1.914 0 0 0 -3.274 0" /> <path d="M12 16h.01" /></svg><div class="ii-notice__body"><p class="ii-notice__title">Upload failed</p><p>The file is over 10 MB. Try a smaller PDF.</p></div></div>
</div>
</body>
</html>
