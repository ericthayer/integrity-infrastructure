<!-- @dsCard group="Forms" height=300 subtitle="Error summary on submit, success panel after; both take focus" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>FormFeedback</title>
<style>
  .pv { display: grid; gap: var(--space-4); padding: var(--space-6); grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); align-items: start; }
</style>
</head>
<body>
<div class="pv">
  <div class="ii-notice ii-notice--danger" tabindex="-1">
    <svg class="ii-icon" data-ii-icon="alert-triangle" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M12 9v4" /> <path d="M10.363 3.591l-8.106 13.534a1.914 1.914 0 0 0 1.636 2.871h16.214a1.914 1.914 0 0 0 1.636 -2.87l-8.106 -13.536a1.914 1.914 0 0 0 -3.274 0" /> <path d="M12 16h.01" /></svg>
    <div class="ii-notice__body">
      <p class="ii-notice__title">Check the highlighted fields</p>
      <ul>
        <li><a href="#f-email">Enter an email address like name@company.com</a></li>
        <li><a href="#f-services">Choose at least one service</a></li>
      </ul>
    </div>
  </div>
  <div class="ii-notice ii-notice--success" tabindex="-1">
    <svg class="ii-icon" data-ii-icon="circle-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M3 12a9 9 0 1 0 18 0a9 9 0 1 0 -18 0" /> <path d="M9 12l2 2l4 -4" /></svg>
    <div class="ii-notice__body">
      <p class="ii-notice__title">Thanks, your request is in</p>
      <p>We will review the details and follow up. For urgent work, call (503) 502-5339.</p>
    </div>
  </div>
</div>
</body>
</html>
