<!-- @dsCard group="Actions" height=300 subtitle="Primary once per view; text on orange is always ink" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Button</title>
<style>
  .pv { display: flex; flex-direction: column; gap: var(--space-5); padding: var(--space-6); }
  .pv__row { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-3) var(--space-4); }
  .pv__photo { padding: var(--space-5); background: var(--neutral-1000); }
</style>
</head>
<body>
<div class="pv">
  <div class="pv__row">
    <a class="ii-btn ii-btn--primary" href="#quote">Request a quote</a>
    <a class="ii-btn ii-btn--secondary" href="#services">Our services</a>
    <a class="ii-btn ii-btn--ghost" href="#roles">View open roles<svg class="ii-icon ii-icon--trail" data-ii-icon="arrow-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M5 12l14 0" /> <path d="M13 18l6 -6" /> <path d="M13 6l6 6" /></svg></a>
  </div>
  <div class="pv__row">
    <a class="ii-btn ii-btn--primary ii-btn--lg" href="#quote">Request a quote<svg class="ii-icon ii-icon--trail" data-ii-icon="arrow-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M5 12l14 0" /> <path d="M13 18l6 -6" /> <path d="M13 6l6 6" /></svg></a>
    <a class="ii-btn ii-btn--primary ii-btn--sm" href="#quote">Request a quote</a>
    <button class="ii-btn ii-btn--primary" type="button" aria-busy="true"><svg class="ii-icon ii-icon--spin" data-ii-icon="loader-2" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M12 3a9 9 0 1 0 9 9" /></svg>Sending</button>
    <button class="ii-btn ii-btn--secondary" type="button" aria-disabled="true">Start an inquiry</button>
  </div>
  <div class="pv__row pv__photo">
    <a class="ii-btn ii-btn--primary" href="#quote">Request a quote</a>
    <a class="ii-btn ii-btn--on-photo" href="tel:+15035025339"><svg class="ii-icon" data-ii-icon="phone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M5 4h4l2 5l-2.5 1.5a11 11 0 0 0 5 5l1.5 -2.5l5 2v4a2 2 0 0 1 -2 2a16 16 0 0 1 -15 -15a2 2 0 0 1 2 -2" /></svg>Call (503) 502-5339</a>
  </div>
  <div class="pv__row" data-for-theme="lit-fiber" hidden>
    <a class="ii-btn ii-btn--primary ii-btn--lg ii-btn--orb" href="#quote" data-ii-magnetic>Request a quote<svg class="ii-icon ii-icon--trail" data-ii-icon="arrow-up-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M17 7l-10 10" /> <path d="M8 7l9 0l0 9" /></svg></a>
    <a class="ii-btn ii-btn--secondary ii-btn--lg" href="#services" data-ii-magnetic>Our services</a>
    <span class="ii-small ii-muted">Orb and magnetic hover (Lit Fiber)</span>
  </div>
</div>
<script>
  /* Preview helper: show the variant each concept uses, following the DS theme switcher. */
  (function () {
    var root = document.documentElement;
    function sync() {
      var theme = root.getAttribute('data-theme') || 'work-light';
      document.querySelectorAll('[data-for-theme]').forEach(function (el) {
        el.hidden = el.getAttribute('data-for-theme').split(' ').indexOf(theme) === -1;
      });
    }
    sync();
    new MutationObserver(sync).observe(root, { attributes: true, attributeFilter: ['data-theme'] });
  })();
</script>

</body>
</html>
