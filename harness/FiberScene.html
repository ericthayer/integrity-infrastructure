<!doctype html>
<html lang="en" data-theme="work-light">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>FiberScene (harness)</title>
<link rel="stylesheet" href="../dist/integrity.css">
<script src="../dist/vendor/gsap.min.js"></script>
<script src="../dist/vendor/ScrollTrigger.min.js"></script>
<script src="../dist/integrity.js"></script>
<style>
  .pv { position: relative; min-height: 520px; overflow: hidden; background: var(--neutral-1000); color: var(--neutral-50); }
  .pv__scene { position: absolute; inset: 0; }
  .pv__scene::before { content: ""; position: absolute; inset: 0; background: radial-gradient(48% 42% at 70% 40%, rgba(232, 119, 34, 0.22), transparent 70%); }
  .pv__scene canvas { position: absolute; inset: 0; width: 100% !important; height: 100% !important; }
  .pv__note { position: absolute; left: var(--space-6); bottom: var(--space-6); max-width: 36rem; font-size: var(--fs-body-sm); color: var(--neutral-400); }
</style>
<style>.hx-bar{position:fixed;right:8px;bottom:8px;z-index:9999;display:flex;gap:4px;font:12px/1 system-ui,sans-serif}.hx-bar button{padding:6px 8px;border:1px solid #888;background:#fff;color:#111;cursor:pointer}.hx-bar button[aria-pressed="true"]{background:#111;color:#fff}</style>
</head>
<body>

<div class="pv">
  <div class="pv__scene" data-ii-scene aria-hidden="true"></div>
  <p class="pv__note">Sixteen glass strands, forty-eight pulses in brand orange and flame yellow. The camera dollies in as the hero scrolls and leans with the pointer. Off screen and hidden tabs pause it; reduced motion shows one still frame; without WebGL only the CSS glow renders.</p>
</div>
<script type="module">
  import * as THREE from '../dist/vendor/three.module.js?v=muqhegk9';
  if (window.IntegrityDS) window.IntegrityDS.scene.mountAll(THREE);
</script>

<div class="hx-bar" role="group" aria-label="Theme"><button type="button" data-t="work-light" aria-pressed="true">work-light</button><button type="button" data-t="as-built" aria-pressed="false">as-built</button><button type="button" data-t="crew" aria-pressed="false">crew</button><button type="button" data-t="lit-fiber" aria-pressed="false">lit-fiber</button></div>
<script>document.querySelector('.hx-bar').addEventListener('click',function(e){var t=e.target.closest('button');if(!t)return;document.documentElement.setAttribute('data-theme',t.dataset.t);this.querySelectorAll('button').forEach(function(b){b.setAttribute('aria-pressed',String(b===t))});});</script>
</body>
</html>
