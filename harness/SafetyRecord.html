<!doctype html>
<html lang="en" data-theme="work-light">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>SafetyRecord (harness)</title>
<link rel="stylesheet" href="../dist/integrity.css">
<script src="../dist/vendor/gsap.min.js"></script>
<script src="../dist/vendor/ScrollTrigger.min.js"></script>
<script src="../dist/integrity.js"></script>
<style>.pv { padding: var(--space-6); }</style>
<style>.hx-bar{position:fixed;right:8px;bottom:8px;z-index:9999;display:flex;gap:4px;font:12px/1 system-ui,sans-serif}.hx-bar button{padding:6px 8px;border:1px solid #888;background:#fff;color:#111;cursor:pointer}.hx-bar button[aria-pressed="true"]{background:#111;color:#fff}</style>
</head>
<body>

<div class="pv">
  <div class="ii-safety">
  <dl class="ii-plate" data-ii-reveal>
    <div class="ii-plate__cell"><dt class="ii-plate__label">EMR</dt><dd class="ii-plate__value"><span class="ii-pending">Client to provide</span></dd></div>
    <div class="ii-plate__cell"><dt class="ii-plate__label">TRIR</dt><dd class="ii-plate__value"><span class="ii-pending">Client to provide</span></dd></div>
    <div class="ii-plate__cell"><dt class="ii-plate__label">DART rate</dt><dd class="ii-plate__value"><span class="ii-pending">Client to provide</span></dd></div>
    <div class="ii-plate__cell"><dt class="ii-plate__label">OSHA training</dt><dd class="ii-plate__value"><span class="ii-pending">Client to provide</span></dd></div>
    <div class="ii-plate__cell"><dt class="ii-plate__label">Certifications</dt><dd class="ii-plate__value"><span class="ii-pending">Client to provide</span></dd></div>
    <div class="ii-plate__cell"><dt class="ii-plate__label">Safety packet</dt><dd class="ii-plate__value"><a href="#contact.html#quote">Request for your bid</a></dd></div>
  </dl>
</div>

</div>

<div class="hx-bar" role="group" aria-label="Theme"><button type="button" data-t="work-light" aria-pressed="true">work-light</button><button type="button" data-t="as-built" aria-pressed="false">as-built</button><button type="button" data-t="crew" aria-pressed="false">crew</button><button type="button" data-t="lit-fiber" aria-pressed="false">lit-fiber</button></div>
<script>document.querySelector('.hx-bar').addEventListener('click',function(e){var t=e.target.closest('button');if(!t)return;document.documentElement.setAttribute('data-theme',t.dataset.t);this.querySelectorAll('button').forEach(function(b){b.setAttribute('aria-pressed',String(b===t))});});</script>
</body>
</html>
