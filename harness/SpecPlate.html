<!doctype html>
<html lang="en" data-theme="work-light">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>SpecPlate (harness)</title>
<link rel="stylesheet" href="../dist/integrity.css">
<script src="../dist/vendor/gsap.min.js"></script>
<script src="../dist/vendor/ScrollTrigger.min.js"></script>
<script src="../dist/integrity.js"></script>
<style>
  .pv { display: grid; gap: var(--space-6); padding: var(--space-6); grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); align-items: start; }
</style>
<style>.hx-bar{position:fixed;right:8px;bottom:8px;z-index:9999;display:flex;gap:4px;font:12px/1 system-ui,sans-serif}.hx-bar button{padding:6px 8px;border:1px solid #888;background:#fff;color:#111;cursor:pointer}.hx-bar button[aria-pressed="true"]{background:#111;color:#fff}</style>
</head>
<body>

<div class="pv">
  <dl class="ii-plate">
    <div class="ii-plate__cell"><dt class="ii-plate__label">Service lines</dt><dd class="ii-plate__value">5</dd></div>
    <div class="ii-plate__cell"><dt class="ii-plate__label">Part of</dt><dd class="ii-plate__value">Integrity Corps</dd></div>
    <div class="ii-plate__cell"><dt class="ii-plate__label">Offices</dt><dd class="ii-plate__value">Sherwood, OR<br>Centennial, CO</dd></div>
    <div class="ii-plate__cell"><dt class="ii-plate__label">Call</dt><dd class="ii-plate__value"><a href="tel:+15035025339">(503) 502-5339</a></dd></div>
  </dl>
  <dl class="ii-plate" style="--plate-cols: 1">
    <div class="ii-plate__cell"><dt class="ii-plate__label">Founded</dt><dd class="ii-plate__value"><span class="ii-pending">Client to provide</span></dd></div>
    <div class="ii-plate__cell"><dt class="ii-plate__label">Crews in the field</dt><dd class="ii-plate__value"><span class="ii-pending">Client to provide</span></dd></div>
  </dl>
</div>

<div class="hx-bar" role="group" aria-label="Theme"><button type="button" data-t="work-light" aria-pressed="true">work-light</button><button type="button" data-t="as-built" aria-pressed="false">as-built</button><button type="button" data-t="crew" aria-pressed="false">crew</button><button type="button" data-t="lit-fiber" aria-pressed="false">lit-fiber</button></div>
<script>document.querySelector('.hx-bar').addEventListener('click',function(e){var t=e.target.closest('button');if(!t)return;document.documentElement.setAttribute('data-theme',t.dataset.t);this.querySelectorAll('button').forEach(function(b){b.setAttribute('aria-pressed',String(b===t))});});</script>
</body>
</html>
