<!doctype html>
<html lang="en" data-theme="work-light">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>PhotoSlot (harness)</title>
<link rel="stylesheet" href="../dist/integrity.css">
<script src="../dist/vendor/gsap.min.js"></script>
<script src="../dist/vendor/ScrollTrigger.min.js"></script>
<script src="../dist/integrity.js"></script>
<style>
  .pv { display: grid; gap: var(--space-4); padding: var(--space-6); grid-template-columns: repeat(3, minmax(0, 1fr)); align-items: start; }
  .pv figure { margin: 0; }
</style>
<style>.hx-bar{position:fixed;right:8px;bottom:8px;z-index:9999;display:flex;gap:4px;font:12px/1 system-ui,sans-serif}.hx-bar button{padding:6px 8px;border:1px solid #888;background:#fff;color:#111;cursor:pointer}.hx-bar button[aria-pressed="true"]{background:#111;color:#fff}</style>
</head>
<body>

<div class="pv">
  <figure><div class="ii-media"><img src="../src/img/photos/splice-tray.jpg" alt="Spliced fibers routed through a splice tray on a workbench"></div><figcaption class="ii-caption">Fiber splicing in the van.</figcaption></figure>
  <figure><div class="ii-media ii-media--portrait" style="--ratio: 4 / 3; --focus: 60% 45%"><img src="../src/img/photos/conduit-reel.jpg" alt="A crew member walks past a reel of orange conduit"></div><figcaption class="ii-caption">Conduit staged for a bore.</figcaption></figure>
  <div class="ii-slot"><svg class="ii-icon" data-ii-icon="camera" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M5 7h1a2 2 0 0 0 2 -2a1 1 0 0 1 1 -1h6a1 1 0 0 1 1 1a2 2 0 0 0 2 2h1a2 2 0 0 1 2 2v9a2 2 0 0 1 -2 2h-14a2 2 0 0 1 -2 -2v-9a2 2 0 0 1 2 -2" /> <path d="M9 13a3 3 0 1 0 6 0a3 3 0 0 0 -6 0" /></svg><p class="ii-slot__label">Photo needed</p><p class="ii-slot__brief">Bucket truck on an aerial run, crew in frame, 3:2 landscape</p></div>
</div>

<div class="hx-bar" role="group" aria-label="Theme"><button type="button" data-t="work-light" aria-pressed="true">work-light</button><button type="button" data-t="as-built" aria-pressed="false">as-built</button><button type="button" data-t="crew" aria-pressed="false">crew</button><button type="button" data-t="lit-fiber" aria-pressed="false">lit-fiber</button></div>
<script>document.querySelector('.hx-bar').addEventListener('click',function(e){var t=e.target.closest('button');if(!t)return;document.documentElement.setAttribute('data-theme',t.dataset.t);this.querySelectorAll('button').forEach(function(b){b.setAttribute('aria-pressed',String(b===t))});});</script>
</body>
</html>
