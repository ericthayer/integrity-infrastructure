<!doctype html>
<html lang="en" data-theme="work-light">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>CallLink (harness)</title>
<link rel="stylesheet" href="../dist/integrity.css">
<script src="../dist/vendor/gsap.min.js"></script>
<script src="../dist/vendor/ScrollTrigger.min.js"></script>
<script src="../dist/integrity.js"></script>
<style>
  .pv { display: flex; flex-wrap: wrap; align-items: stretch; gap: var(--space-4); padding: var(--space-6); }
  .pv > div { padding: var(--space-6) var(--space-8); border-radius: var(--radius-card); }
  .pv__plain { border: 1px solid var(--border); }
</style>
<style>.hx-bar{position:fixed;right:8px;bottom:8px;z-index:9999;display:flex;gap:4px;font:12px/1 system-ui,sans-serif}.hx-bar button{padding:6px 8px;border:1px solid #888;background:#fff;color:#111;cursor:pointer}.hx-bar button[aria-pressed="true"]{background:#111;color:#fff}</style>
</head>
<body>

<div class="pv">
  <div class="pv__plain">
    <a class="ii-call" href="tel:+15035025339"><span class="ii-call__label">Call for a quote</span><span class="ii-call__number">(503) 502-5339</span></a>
  </div>
  <div class="ii-on-accent">
    <a class="ii-call" href="tel:+15035025339"><span class="ii-call__label">Call for a quote</span><span class="ii-call__number">(503) 502-5339</span></a>
  </div>
</div>

<div class="hx-bar" role="group" aria-label="Theme"><button type="button" data-t="work-light" aria-pressed="true">work-light</button><button type="button" data-t="as-built" aria-pressed="false">as-built</button><button type="button" data-t="crew" aria-pressed="false">crew</button><button type="button" data-t="lit-fiber" aria-pressed="false">lit-fiber</button></div>
<script>document.querySelector('.hx-bar').addEventListener('click',function(e){var t=e.target.closest('button');if(!t)return;document.documentElement.setAttribute('data-theme',t.dataset.t);this.querySelectorAll('button').forEach(function(b){b.setAttribute('aria-pressed',String(b===t))});});</script>
</body>
</html>
