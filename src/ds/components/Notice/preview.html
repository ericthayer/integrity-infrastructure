<!-- @dsCard group="Feedback" height=280 subtitle="Info, success and danger; every status carries an icon and a word, never color alone" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Notice</title>
<style>.pv { display: grid; gap: var(--space-4); padding: var(--space-6); grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); align-items: start; }</style>
</head>
<body>
<div class="pv">
  <div class="ii-notice ii-notice--info"><svg class="ii-icon" data-ii-icon="info-circle"></svg><div class="ii-notice__body"><p class="ii-notice__title">Emergency repair</p><p>For outages and emergency repair, call (503) 502-5339.</p></div></div>
  <div class="ii-notice ii-notice--success"><svg class="ii-icon" data-ii-icon="circle-check"></svg><div class="ii-notice__body"><p class="ii-notice__title">Request sent</p><p>We will follow up by phone or email.</p></div></div>
  <div class="ii-notice ii-notice--danger"><svg class="ii-icon" data-ii-icon="alert-triangle"></svg><div class="ii-notice__body"><p class="ii-notice__title">Upload failed</p><p>The file is over 10 MB. Try a smaller PDF.</p></div></div>
</div>
</body>
</html>
