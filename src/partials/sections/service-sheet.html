<dialog class="ii-sheet" id="{{id|service-sheet}}" aria-labelledby="{{id|service-sheet}}-title">
  <div class="ii-sheet__panel ii-shell">
    <button class="ii-sheet__close" type="button" autofocus data-ii-sheet-close><svg class="ii-icon" data-ii-icon="x"></svg><span class="ii-visually-hidden">Close</span></button>
    <div class="ii-sheet__media" data-ii-sheet-media></div>
    <div class="ii-sheet__body">
      <span class="ii-sheet__index" data-ii-sheet-index></span>
      <h2 class="ii-h2" id="{{id|service-sheet}}-title" data-ii-sheet-title>Service</h2>
      <p class="ii-lead ii-muted" data-ii-sheet-desc></p>
      <ul class="ii-checks" role="list" data-ii-sheet-scope></ul>
      <div class="ii-hero__actions">
        <a class="ii-btn ii-btn--primary ii-btn--orb" href="{{base|}}contact.html#quote">Request a quote<svg class="ii-icon ii-icon--trail" data-ii-icon="arrow-up-right"></svg></a>
        <a class="ii-arrow-link" href="{{base|}}services.html" data-ii-sheet-link>Our services<svg class="ii-icon" data-ii-icon="arrow-right"></svg></a>
      </div>
    </div>
  </div>
</dialog>
