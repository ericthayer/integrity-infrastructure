<div class="ii-jobs" id="{{id|jobs}}" data-ii-jobs data-src="{{src|}}">
  <ul class="ii-jobs__list" role="list" aria-busy="true" aria-live="polite">
    <li class="ii-job ii-job--skeleton" aria-hidden="true"><div class="ii-stack" style="--stack-gap: var(--space-3)"><span class="ii-skeleton"></span><span class="ii-skeleton"></span></div></li>
    <li class="ii-job ii-job--skeleton" aria-hidden="true"><div class="ii-stack" style="--stack-gap: var(--space-3)"><span class="ii-skeleton"></span><span class="ii-skeleton"></span></div></li>
    <li class="ii-job ii-job--skeleton" aria-hidden="true"><div class="ii-stack" style="--stack-gap: var(--space-3)"><span class="ii-skeleton"></span><span class="ii-skeleton"></span></div></li>
  </ul>
  <div class="ii-notice ii-notice--info" data-ii-jobs-empty hidden>
    <svg class="ii-icon" data-ii-icon="briefcase"></svg>
    <div class="ii-notice__body">
      <p class="ii-notice__title">No open roles right now</p>
      <p>Tell us about yourself and the work you do, and we will reach out when a role that fits opens.</p>
      <a class="ii-arrow-link" href="{{base|}}contact.html?topic=careers#quote">Contact our team<svg class="ii-icon" data-ii-icon="arrow-right"></svg></a>
    </div>
  </div>
  <div class="ii-notice ii-notice--danger" data-ii-jobs-error hidden>
    <svg class="ii-icon" data-ii-icon="alert-triangle"></svg>
    <div class="ii-notice__body">
      <p class="ii-notice__title">We could not load open roles</p>
      <p>Every opening is also listed on our Paylocity careers page.</p>
      <a class="ii-arrow-link" href="https://recruiting.paylocity.com/" target="_blank" rel="noopener">Open roles on Paylocity<svg class="ii-icon" data-ii-icon="external-link"></svg><span class="ii-visually-hidden"> (opens in a new tab)</span></a>
    </div>
  </div>
</div>
