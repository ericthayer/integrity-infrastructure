<form class="ii-form" action="#" method="post" enctype="multipart/form-data" data-ii-form data-ii-demo aria-label="Subcontractor inquiry">
  <div class="ii-notice ii-notice--danger" data-ii-error-summary tabindex="-1" hidden>
    <svg class="ii-icon" data-ii-icon="alert-triangle"></svg>
    <div class="ii-notice__body">
      <p class="ii-notice__title">Check the highlighted fields</p>
      <ul data-ii-error-list></ul>
    </div>
  </div>
  <div class="ii-form__row ii-form__row--2">
    <div class="ii-field">
      <label class="ii-field__label" for="{{p|s}}-company">Company name</label>
      <input class="ii-input" id="{{p|s}}-company" name="company" autocomplete="organization" required>
    </div>
    <div class="ii-field">
      <label class="ii-field__label" for="{{p|s}}-contact">Contact name</label>
      <input class="ii-input" id="{{p|s}}-contact" name="contact" autocomplete="name" required>
    </div>
  </div>
  <div class="ii-form__row ii-form__row--2">
    <div class="ii-field">
      <label class="ii-field__label" for="{{p|s}}-email">Email</label>
      <input class="ii-input" id="{{p|s}}-email" name="email" type="email" autocomplete="email" required>
    </div>
    <div class="ii-field">
      <label class="ii-field__label" for="{{p|s}}-phone">Phone</label>
      <input class="ii-input" id="{{p|s}}-phone" name="phone" type="tel" autocomplete="tel" pattern="[\d\s\(\)\+\.\-]{10,}" required>
    </div>
  </div>
  <fieldset class="ii-fieldset" data-ii-required data-ii-error="Choose at least one trade">
    <legend class="ii-fieldset__legend">Trades you perform</legend>
    <div class="ii-choices ii-choices--2">
      <label class="ii-choice"><input type="checkbox" id="{{p|s}}-trade-1" name="trades" value="Fiber splicing">Fiber splicing</label>
      <label class="ii-choice"><input type="checkbox" id="{{p|s}}-trade-2" name="trades" value="Directional boring">Directional boring</label>
      <label class="ii-choice"><input type="checkbox" id="{{p|s}}-trade-3" name="trades" value="Aerial construction">Aerial construction</label>
      <label class="ii-choice"><input type="checkbox" id="{{p|s}}-trade-4" name="trades" value="ISP and premises installation">ISP and premises installation</label>
      <label class="ii-choice"><input type="checkbox" id="{{p|s}}-trade-5" name="trades" value="Concrete and asphalt restoration">Concrete and asphalt restoration</label>
      <label class="ii-choice"><input type="checkbox" id="{{p|s}}-trade-6" name="trades" value="Other">Other</label>
    </div>
  </fieldset>
  <div class="ii-form__row ii-form__row--2">
    <div class="ii-field">
      <label class="ii-field__label" for="{{p|s}}-crew">Crew size</label>
      <div class="ii-select-wrap">
        <select class="ii-select" id="{{p|s}}-crew" name="crew_size" required>
          <option value="">Choose a range</option>
          <option>1 to 5 people</option>
          <option>6 to 15 people</option>
          <option>16 to 30 people</option>
          <option>More than 30 people</option>
        </select>
        <svg class="ii-icon" data-ii-icon="chevron-down"></svg>
      </div>
    </div>
    <div class="ii-field">
      <label class="ii-field__label" for="{{p|s}}-area">Service area</label>
      <p class="ii-field__hint" id="{{p|s}}-area-hint">States and metro areas you cover</p>
      <input class="ii-input" id="{{p|s}}-area" name="service_area" aria-describedby="{{p|s}}-area-hint" required>
    </div>
  </div>
  <div class="ii-form__row ii-form__row--2">
    <div class="ii-field">
      <label class="ii-field__label" for="{{p|s}}-coi">Certificate of insurance <span class="ii-field__opt">(optional)</span></label>
      <p class="ii-field__hint" id="{{p|s}}-coi-hint" data-ii-file-names="PDF or image, 10 MB max">PDF or image, 10 MB max</p>
      <input class="ii-file" id="{{p|s}}-coi" name="coi" type="file" accept=".pdf,image/*" aria-describedby="{{p|s}}-coi-hint">
    </div>
    <div class="ii-field">
      <label class="ii-field__label" for="{{p|s}}-emr">EMR <span class="ii-field__opt">(optional)</span></label>
      <p class="ii-field__hint" id="{{p|s}}-emr-hint">Your current experience modification rate</p>
      <input class="ii-input" id="{{p|s}}-emr" name="emr" inputmode="decimal" aria-describedby="{{p|s}}-emr-hint">
    </div>
  </div>
  <div class="ii-field">
    <label class="ii-field__label" for="{{p|s}}-message">Anything else <span class="ii-field__opt">(optional)</span></label>
    <textarea class="ii-textarea" id="{{p|s}}-message" name="message"></textarea>
  </div>
  <div class="ii-form__foot">
    <button class="ii-btn ii-btn--primary ii-btn--lg" type="submit">Start an inquiry<svg class="ii-icon ii-icon--trail" data-ii-icon="arrow-right"></svg></button>
  </div>
</form>
<div class="ii-notice ii-notice--success" data-ii-success tabindex="-1" hidden>
  <svg class="ii-icon" data-ii-icon="circle-check"></svg>
  <div class="ii-notice__body">
    <p class="ii-notice__title">Thanks, we have your details</p>
    <p>Our operations team reviews every inquiry and will reach out when there is a fit.</p>
  </div>
</div>
