# Vite builds the editable HTML entries and their assets into a standalone site.
[build]
  base = "."
  command = "npm run verify"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# Vite fingerprints everything under /assets/, so it can be cached for a year.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Review deployment: keep every response out of search indexes; basic hardening.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
