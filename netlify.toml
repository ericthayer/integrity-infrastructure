# Vite builds the editable HTML entries and their assets into a standalone site.
[build]
  base = "."
  command = "npm run verify"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# Vite fingerprints everything under /assets/, so it can be cached for a year.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Review deployment: keep every response out of search indexes; basic hardening.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Client review deployment: the design-exploration pages (concept prototypes and brand
# boards) still contain the Integrity Corps lockup line and the sister-company fleet
# photo, so they are not served. Their files stay in the build and the tests, and the
# original-site snapshot at /reference/ stays reachable for before/after comparison.
# To restore the concepts for internal review, delete the rules below. At launch, drop
# these pages from the build as well (tasks/website-todo.md, "Before launch").
[[redirects]]
  from = "/concepts"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/concepts/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/brandkit"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/brandkit/*"
  to = "/404.html"
  status = 404
  force = true
